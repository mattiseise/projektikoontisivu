<svg xmlns="http://www.w3.org/2000/svg" width="880" height="844" viewBox="0 0 880 844" role="img" aria-labelledby="title desc">
<title id="title">NoppaKauppa: projektin vaiheet</title>
<desc id="desc">1. Toimeksianto ja suunnitelma (työviikot 1–2): Selvität asiakkaan tarpeen kysymyslistalla, pystytät repositoryn ja molemmat kehityspalvelimet ja teet suunnitelman: käyttäjätarinat, tietomallin ja GitHub-issuet. Suunnitelma tehdään ennen koodia, koska ostoskori ja tilaus rakentuvat tietomallin varaan. 2. Tuotteet näkyviin ja verkkoon (työviikot 3–5): Tuotteet tulevat SQLite-kannasta rajapinnan kautta itse rakennettuihin Vue-komponentteihin, kategoriat ja tuotesivut saavat omat osoitteensa, ja kauppa julkaistaan. Julkaisu tehdään jo nyt, koska sen ongelmat on helpointa korjata, kun rikottavaa on vähän. 3. Asiakkaan ostopolku (työviikot 6–10): Rakennat ostopolun samassa järjestyksessä kuin asiakas sen kulkee: haku, ostoskori, tunnukset ja tilaus. Lopuksi ulkopuolinen henkilö kokeilee kauppaa asiakkaan roolissa, ja hänen palautteensa ohjaa seuraavaa vaihetta. 4. Henkilökunta, tietoturva ja laatu (työviikot 11–15): Toteutat tärkeimmän palautemuutoksen, henkilökunnan tuote- ja tilausnäkymät roolisuojauksella ja saavutettavuustarkistuksen. Ominaisuuslista päättyy työviikolla 13, minkä jälkeen koettelet tietoturvan omin hyökkäystestein ja ajat koko testimatriisin julkaistua versiota vasten. 5. Julkaisu ja näyttö (työviikot 16–18): Jäädytät sisällön julkaisuehdokkaaksi, ja ulkopuolinen testaaja ottaa kaupan käyttöön pelkän kirjoitetun ohjeen avulla. Korjaat estävät löydökset, luovutat version 1.0 asiakkaalle ja osoitat osaamisesi näytössä.</desc>
<rect width="880" height="844" fill="#ffffff"/>
<defs><marker id="nuoli" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c5347" stroke-width="1.4"/></marker></defs>
<text x="40" y="49" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Mitä syntyy missäkin vaiheessa?</text>
<rect x="90" y="78" width="752" height="132" rx="12" fill="#ffffff" stroke="#8d5a2b" stroke-width="2"/>
<circle cx="45" cy="107" r="24" fill="#8d5a2b"/>
<text x="45" y="117" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">1</text>
<text x="112" y="114" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Toimeksianto ja suunnitelma</text>
<text x="822" y="114" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 1–2</text>
<text x="112" y="150" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kysymyslista → työympäristö → suunnitelma ja issuet</text>
<text x="112" y="180" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Tiedät, mitä rakennat ja missä järjestyksessä.</text>
<path d="M45 136V224" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="230" width="752" height="132" rx="12" fill="#ffffff" stroke="#1a6fae" stroke-width="2"/>
<circle cx="45" cy="259" r="24" fill="#1a6fae"/>
<text x="45" y="269" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">2</text>
<text x="112" y="266" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Tuotteet näkyviin ja verkkoon</text>
<text x="822" y="266" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 3–5</text>
<text x="112" y="302" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kanta → rajapinta → komponentit → reitit → julkaisu</text>
<text x="112" y="332" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Tuotteet näkyvät julkisessa osoitteessa.</text>
<path d="M45 288V376" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="382" width="752" height="132" rx="12" fill="#ffffff" stroke="#c03434" stroke-width="2"/>
<circle cx="45" cy="411" r="24" fill="#c03434"/>
<text x="45" y="421" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">3</text>
<text x="112" y="418" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Asiakkaan ostopolku</text>
<text x="822" y="418" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 6–10</text>
<text x="112" y="454" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Haku → ostoskori → tunnukset → tilaus → katselmointi</text>
<text x="112" y="484" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Asiakas löytää pelin ja tilaa sen ilman verkkomaksua.</text>
<path d="M45 440V528" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="534" width="752" height="132" rx="12" fill="#ffffff" stroke="#2b6e6e" stroke-width="2"/>
<circle cx="45" cy="563" r="24" fill="#2b6e6e"/>
<text x="45" y="573" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">4</text>
<text x="112" y="570" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Henkilökunta, tietoturva ja laatu</text>
<text x="822" y="570" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 11–15</text>
<text x="112" y="606" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Palaute → henkilökunnan näkymät → tietoturva → testit</text>
<text x="112" y="636" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kauppa kestää oikeat käyttäjät ja hyökkäysyritykset.</text>
<path d="M45 592V680" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="686" width="752" height="132" rx="12" fill="#ffffff" stroke="#6d3fa0" stroke-width="2"/>
<circle cx="45" cy="715" r="24" fill="#6d3fa0"/>
<text x="45" y="725" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">5</text>
<text x="112" y="722" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Julkaisu ja näyttö</text>
<text x="822" y="722" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 16–18</text>
<text x="112" y="758" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Julkaisuehdokas → julkaisutesti → v1.0 → näyttö</text>
<text x="112" y="788" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Asiakas saa kaupan, jonka voi ottaa käyttöön ohjeella.</text>
</svg>
