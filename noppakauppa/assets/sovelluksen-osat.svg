<svg xmlns="http://www.w3.org/2000/svg" width="880" height="604" viewBox="0 0 880 604" role="img" aria-labelledby="title desc">
<title id="title">Havainnekuva: NoppaKaupan osat ja niiden yhteys</title>
<desc id="desc">Asiakas selaa, hakee ja tilaa, ja henkilökunta hallitsee tuotteita ja tilauksia. Molemmat käyttävät kauppaa selaimessa. Selaimen Vue-sovelluksessa (frontend/, Vue 3, Vite, Pinia ja vue-router) ovat kaupan näkymät eli kategoriat, haku, tuotesivu, kori ja tilaus, Pinia-storet ostoskorille ja kirjautumistilalle sekä henkilökunnan hallintanäkymät, joista reitin vartija ohjaa muut käyttäjät pois. 1 Pyyntö: selain lähettää fetch-kutsun rajapinnan osoitteeseen /api/… istuntotiedon kanssa. 2 Vastaus: rajapinta palauttaa JSONin tai virhekoodin. FastAPI-rajapinnassa (backend/, Python) ovat endpointit tuotteille, haulle, kirjautumiselle ja tilauksille, salasanojen hashaus ja istunto sekä roolitarkistus, joka palauttaa 401, jos käyttäjä ei ole kirjautunut, ja 403, jos hänellä ei ole oikeuksia. Rajapinta käyttää SQLite-kantaa parametrisoiduilla kyselyillä. Kannassa ovat taulut tuote, kategoria, kayttaja rooleineen, tilaus tiloineen ja tilausrivi tilaushetken hintoineen. Julkaisu työviikosta 5 alkaen: frontendin build ja backend ovat julkaisualustalla, rajapinnan osoite ja salaisuudet ovat ympäristömuuttujissa, ja CORS sallii vain kaupan oman osoitteen. Havainnekuva, ei kuvakaappaus valmiista kaupasta.</desc>
<rect width="880" height="604" fill="#ffffff"/>
<defs>
  <marker id="nuoli" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5c5347"/></marker>
</defs>
<text x="24" y="44" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Miten NoppaKaupan osat liittyvät toisiinsa?</text>

