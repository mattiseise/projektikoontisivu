0" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f5a52" text-anchor="start" font-weight="normal">Asiakkaan sanat:</text><text x="330" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f1d1a" text-anchor="start" font-weight="normal">”Maaliin tulo on niin</text><text x="330" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f1d1a" text-anchor="start" font-weight="normal">nopea, etten ehtinyt</text><text x="330" y="212" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f1d1a" text-anchor="start" font-weight="normal">nähdä, mitä tapahtui.”</text><line x1="330" y1="234" x2="580" y2="234" stroke="#cfc8bc" stroke-width="2"/><text x="330" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f5a52" text-anchor="start" font-weight="normal">Oma tulkinta:</text><text x="330" y="290" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f1d1a" text-anchor="start" font-weight="normal">Loppuruutu näkyy</text><text x="330" y="314" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f1d1a" text-anchor="start" font-weight="normal">vähintään 3 s.</text><rect x="630" y="70" width="220" height="310" rx="8" fill="#f4f1ec" stroke="#cfc8bc" stroke-width="2" /><text x="646" y="102" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f1d1a" text-anchor="start" font-weight="bold">Tulossa</text><rect x="646" y="120" width="188" height="70" rx="6" fill="#ffffff" stroke="#be185d" stroke-width="2" /><text x="660" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f1d1a" text-anchor="start" font-weight="normal">Loppuruutu 3 s</text><text x="660" y="176" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f5a52" text-anchor="start" font-weight="normal">lähde: palaute</text><rect x="646" y="205" width="188" height="70" rx="6" fill="#ffffff" stroke="#be185d" stroke-width="2" /><text x="660" y="235" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f1d1a" text-anchor="start" font-weight="normal">Ohje näkyviin</text><text x="660" y="261" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f5a52" text-anchor="start" font-weight="normal">lähde: palaute</text><line x1="604" y1="290" x2="640" y2="240" stroke="#1f1d1a" stroke-width="3" marker-end="url(#nuoli)"/></svg>
