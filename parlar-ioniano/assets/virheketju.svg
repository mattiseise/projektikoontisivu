<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="title desc">
<title id="title">One debugging chain, link by link</title>
<desc id="desc">Illustration of a debugging chain, not a screenshot. Six linked steps, each one line in project-docs/debugging-chains.md: 1 observation, the tester's or your own words verbatim; 2 reproduction, the steps that make it happen every time; 3 cause, the actual reason in the code or the data, not a guess; 4 fix, one commit that changes it, linked in the chain; 5 re-test, the same steps with the expected and the observed result; 6 regression test, a new numbered test case in project-docs/test-matrix.md. The last line of every chain names the sources you used, for example MDN or the Bootstrap documentation. Where the three chains come from: chain 1 in week 44 from a finding in the review; chain 2 in weeks 45 to 46 from a real bug in the converter or the phrasebook; chain 3 in week 47 from a failing row in the matrix run.</desc>
<rect width="880" height="540" fill="#ffffff"/>
