<svg xmlns="http://www.w3.org/2000/svg" width="880" height="692" viewBox="0 0 880 692" role="img" aria-labelledby="title desc">
<title id="title">How the parts of Parlar Ioniano fit together</title>
<desc id="desc">Illustration of how the parts of Parlar Ioniano fit together, not a screenshot. Your 58-page reference PDF is the only source of truth for the language content: you type every form from it and check the site against it, and an invented form is a bug. The data folder holds the language content as JSON files typed from the PDF: letters.json for the alphabet and IPA, words.json for the vocabulary in four keys, grammar.json for the pronouns and articles, numbers.json for the number words and rules, and phrases.json for the dialogues and the coming later topics; tools/check-data.html checks every file. Your JavaScript in the js folder fetches and renders the data: data.js with loadJSON, the one shared loader; render.js with renderTable for the tables; numbers.js with pure functions and no DOM code; and the page scripts, such as alphabet.js. It builds elements with textContent, not innerHTML. The pages are what the learner sees: index.html with Home, the credit and the terms; alphabet.html with the letters and IPA; pronouns.html with eight tables in tabs; nouns.html with an accordion of matrices; numbers.html with the converter built by hand; and phrasebook.html with the cards, the dialogue and the search. Below the code, the tests: tests/tests.html runs tests/numbers.test.js against js/numbers.js with expected values from the PDF, and each test case is a numbered row in project-docs/test-matrix.md. Below the pages, what comes from a CDN with pinned versions: Bootstrap CSS and JS with an integrity hash, Bootstrap Icons and the Google font; css/style.css overrides Bootstrap's variables. The release path runs from your folder served by Live Server at http://localhost, to the Git repository where you push to main and tag v0.5 and v1.0, to GitHub Pages, the public URL over HTTPS.</desc>
