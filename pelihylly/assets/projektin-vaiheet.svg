<svg xmlns="http://www.w3.org/2000/svg" width="880" height="844" viewBox="0 0 880 844" role="img" aria-labelledby="title desc">
<title id="title">PeliHylly: projektin vaiheet</title>
<desc id="desc">1. Suunnitelma ja julkaistu runko (työviikot 1–3): Puret toimeksiannon kysymyksiksi, teet ohjaajan kuittaaman suunnitelman ja viet tyhjän palvelun julkiseen osoitteeseen. Julkaisu tehdään heti, koska sen ongelmat on halvinta korjata, kun rikottavaa on vähän. 2. Oma hylly: pelit ja tilanvaihto (työviikot 4–6): Rakennat pelilistan tietokannasta, oman lisäyslomakkeen validointeineen ja yhden napin tilanvaihdon, joka kirjaa tilahistorian. Asiakkaan tärkein toive toimii ennen kuin palveluun tulee muita käyttäjiä. 3. Jäsenet, profiilit ja katselmointi (työviikot 7–10): Lisäät rekisteröitymisen, kirjautumisen ja omistajuustarkistuksen, julkisen profiilin sekä haun. Asiakkaan edustaja kokeilee koko polkua työviikolla 10, ja hänen palautteensa ohjaa seuraavaa vaihetta. 4. Palaute, laatu ja käyttöönotto-ohje (työviikot 11–15): Toteutat palautteen tärkeimmän muutoksen ja teet palvelusta puhelimella ja näppäimistöllä toimivan. Testaat kaiken tuotantoa vasten, siistit koodin, arvioit tietoturvan ja kirjoitat käyttöönotto-ohjeen. 5. Julkaisu ja näyttö (työviikot 16–18): Ulkopuolinen testaaja ottaa julkaisuehdokkaan käyttöön pelkän kirjallisen ohjeen avulla. Korjaat estävät virheet, julkaiset v1.0:n ja esittelet työsi näytössä.</desc>
<rect width="880" height="844" fill="#ffffff"/>
<defs><marker id="nuoli" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c5347" stroke-width="1.4"/></marker></defs>
<text x="40" y="49" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Mitä syntyy missäkin vaiheessa?</text>
<rect x="90" y="78" width="752" height="132" rx="12" fill="#ffffff" stroke="#8d5a2b" stroke-width="2"/>
<circle cx="45" cy="107" r="24" fill="#8d5a2b"/>
<text x="45" y="117" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">1</text>
<text x="112" y="114" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Suunnitelma ja julkaistu runko</text>
<text x="822" y="114" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 1–3</text>
<text x="112" y="150" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Toimeksianto → suunnitelma → julkinen osoite</text>
<text x="112" y="180" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Palvelun pohja on verkossa ennen ensimmäistä peliä.</text>
<path d="M45 136V224" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="230" width="752" height="132" rx="12" fill="#ffffff" stroke="#6b7f3f" stroke-width="2"/>
<circle cx="45" cy="259" r="24" fill="#6b7f3f"/>
<text x="45" y="269" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">2</text>
<text x="112" y="266" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Oma hylly: pelit ja tilanvaihto</text>
<text x="822" y="266" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 4–6</text>
<text x="112" y="302" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Pelilista → lisäyslomake → tila yhdellä napilla</text>
<text x="112" y="332" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Oma peli hyllyyn, tila vaihtuu ja historia kirjautuu.</text>
<path d="M45 288V376" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="382" width="752" height="132" rx="12" fill="#ffffff" stroke="#5b6b8c" stroke-width="2"/>
<circle cx="45" cy="411" r="24" fill="#5b6b8c"/>
<text x="45" y="421" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">3</text>
<text x="112" y="418" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Jäsenet, profiilit ja katselmointi</text>
<text x="822" y="418" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 7–10</text>
<text x="112" y="454" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kirjautuminen → profiili → haku → katselmointi</text>
<text x="112" y="484" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Asiakkaan edustaja kokeilee palvelua työviikolla 10.</text>
<path d="M45 440V528" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="534" width="752" height="132" rx="12" fill="#ffffff" stroke="#8d4a5b" stroke-width="2"/>
<circle cx="45" cy="563" r="24" fill="#8d4a5b"/>
<text x="45" y="573" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">4</text>
<text x="112" y="570" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Palaute, laatu ja käyttöönotto-ohje</text>
<text x="822" y="570" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 11–15</text>
<text x="112" y="606" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Palautemuutos → saavutettavuus → testaus → ohje</text>
<text x="112" y="636" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Palvelu kestää oikeat käyttäjät ilman tekijää.</text>
<path d="M45 592V680" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="686" width="752" height="132" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<circle cx="45" cy="715" r="24" fill="#0f766e"/>
<text x="45" y="725" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">5</text>
<text x="112" y="722" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Julkaisu ja näyttö</text>
<text x="822" y="722" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 16–18</text>
<text x="112" y="758" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Julkaisuehdokas → julkaisutesti → v1.0 → näyttö</text>
<text x="112" y="788" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Yhdistys saa palvelun käyttöön kirjallisella ohjeella.</text>
</svg>
