<text x="440" y="198" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">POST /api/games</text>
<text x="440" y="216" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">+ pelin tiedot</text>
<path d="M512 300H374" fill="none" stroke="#5c5347" stroke-width="2.5" marker-end="url(#nuoli)"/>
