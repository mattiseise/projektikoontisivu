<text x="440" y="322" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">JSON tai</text>
<text x="440" y="340" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">virhekoodi</text>

<!-- Tietokanta -->
<path d="M683 378V408" fill="none" stroke="#5c5347" stroke-width="2" marker-end="url(#nuoli)"/>
<text x="698" y="398" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14">SQL-kyselyt</text>
<rect x="518" y="414" width="330" height="88" rx="12" fill="#ede9fe" stroke="#5b21b6" stroke-width="2"/>
<text x="538" y="444" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">SQLite-tietokanta</text>
<text x="538" y="468" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">users · games · status_history</text>
<text x="538" y="489" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">migraatio luo taulut, siemendata pelit</text>

<!-- Julkaisu -->
<rect x="32" y="414" width="456" height="132" rx="12" fill="#ffffff" stroke="#5b21b6" stroke-width="2" stroke-dasharray="7 5"/>
<text x="52" y="444" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Julkaisussa yksi palvelin, yksi osoite</text>
<text x="52" y="470" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">Palvelin tarjoilee rajapinnan ja Reactin</text>
<text x="52" y="490" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">tuotantobuildin (client/dist) samasta osoitteesta.</text>
<text x="52" y="510" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">SQLite-tiedosto on alustan pysyvällä levyllä.</text>
<text x="52" y="532" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic">Ehdotettu malli: alusta valitaan työviikolla 3.</text>
<text x="32" y="580" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14">Havainnekuva, ei kuvakaappaus valmiista palvelusta.</text>
</svg>
