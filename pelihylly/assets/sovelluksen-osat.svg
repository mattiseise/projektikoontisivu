<rect x="518" y="74" width="330" height="300" rx="12" fill="#fdfcf9" stroke="#6d28d9" stroke-width="2"/>
<text x="538" y="108" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Express-rajapinta · server/</text>
<text x="538" y="134" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="16">Node.js + Express</text>
<rect x="538" y="152" width="290" height="60" rx="8" fill="#ede9fe"/>
<text x="554" y="178" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Syötteen tarkistus</text>
<text x="554" y="199" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">virhe 400 ja virhelista kentittäin</text>
<rect x="538" y="224" width="290" height="60" rx="8" fill="#ede9fe"/>
<text x="554" y="250" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Kirjautuminen ja omistajuus</text>
<text x="554" y="271" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">401 ei kirjautunut, 403 ei oikeutta</text>
<rect x="538" y="296" width="290" height="60" rx="8" fill="#ede9fe"/>
<text x="554" y="322" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Tilanvaihto transaktiossa</text>
<text x="554" y="343" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">tila ja historiarivi yhdessä</text>

