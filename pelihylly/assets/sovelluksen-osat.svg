<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="title desc">
<title id="title">Miten PeliHyllyn osat liittyvät toisiinsa</title>
<desc id="desc">Havainnekuva, ei kuvakaappaus. Selaimessa toimiva React-sovellus (client-kansio) sisältää pelilistan ja lisäyslomakkeen, tilanapin ja tilahistorian sekä julkisen profiilin, jonka vierailija näkee ilman tunnuksia. Selain lähettää Express-rajapinnalle (server-kansio) pyynnön, esimerkiksi POST /api/games ja pelin tiedot JSON-muodossa. Express tarkistaa syötteen (virhe 400 ja virhelista kentittäin), kirjautumisen ja omistajuuden (401 ei kirjautunut, 403 ei oikeutta) ja tallentaa tilanvaihdon ja historiarivin samassa transaktiossa. Express lukee ja kirjoittaa SQLite-tietokantaa SQL-kyselyillä; taulut ovat users, games ja status_history. Vastaus palaa selaimelle JSON-muodossa tai virhekoodina. Julkaisussa yksi palvelin tarjoilee rajapinnan ja Reactin tuotantobuildin samasta osoitteesta, ja SQLite-tiedosto on alustan pysyvällä levyllä. Alusta valitaan työviikolla 3.</desc>
<rect width="880" height="600" fill="#ffffff"/>
<defs>
  <marker id="nuoli" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5c5347"/></marker>
</defs>
<text x="32" y="44" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Miten PeliHyllyn osat liittyvät toisiinsa?</text>

<!-- Selain -->
<rect x="32" y="74" width="330" height="300" rx="12" fill="#fdfcf9" stroke="#6d28d9" stroke-width="2"/>
<text x="52" y="108" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Selain · client/</text>
<text x="52" y="134" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="16">React + Vite + react-router</text>
<rect x="52" y="152" width="290" height="60" rx="8" fill="#ede9fe"/>
<text x="68" y="178" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Pelilista ja lisäyslomake</text>
<text x="68" y="199" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">oma lomake, virheet kentittäin</text>
<rect x="52" y="224" width="290" height="60" rx="8" fill="#ede9fe"/>
<text x="68" y="250" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Tilanappi ja tilahistoria</text>
<text x="68" y="271" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">tila vaihtuu yhdellä napilla</text>
<rect x="52" y="296" width="290" height="60" rx="8" fill="#ede9fe"/>
<text x="68" y="322" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Julkinen profiili</text>
<text x="68" y="343" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">vierailija näkee ilman tunnuksia</text>

