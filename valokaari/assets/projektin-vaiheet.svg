<svg xmlns="http://www.w3.org/2000/svg" width="880" height="844" viewBox="0 0 880 844" role="img" aria-labelledby="title desc">
<title id="title">Valokaari: projektin vaiheet</title>
<desc id="desc">1. Valmistelu ja julkaistu runko (työviikot 1–3): Otat työkalut käyttöön, teet hyväksytyn suunnitelman ja viet tyhjän sovelluksen julkiseen osoitteeseen. Julkaisu tehdään ensin, koska se on projektin todennäköisin kaatumiskohta. 2. Oikea päivänvalodata (työviikot 4–5): Kirjoitat päivänvalolaskennan testeineen ja paikkakuntahaun. Rajapinta palauttaa minkä tahansa Suomen paikkakunnan vuoden oikein, myös kaamoksen ja yöttömän yön. 3. Kaavio matkailijalle (työviikot 6–10): Rakennat kaavion, monen paikan vertailun, vihjeruudun ja leikkauspisteet. Asiakkaan edustaja kokeilee väliversiota ja kertoo, mitä muutetaan. 4. Viimeistely ja laatu (työviikot 11–15): Toteutat vuosivalinnan ja katselmoinnin tärkeimmän muutoksen, teet sovelluksesta mobiilissa ja näppäimistöllä toimivan ja arvioit tietoturvan. Testaus ja dokumentaatio kootaan valmiiksi. 5. Julkaisu ja näyttö (työviikot 16–18): Ulkopuolinen testaaja kokeilee julkaisuehdokasta pelkän ohjeen avulla. Korjaat esteet, julkaiset v1.0:n ja esittelet työsi näytössä.</desc>
<rect width="880" height="844" fill="#ffffff"/>
<defs><marker id="nuoli" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c5347" stroke-width="1.4"/></marker></defs>
<text x="40" y="49" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Mitä syntyy missäkin vaiheessa?</text>
<rect x="90" y="78" width="752" height="132" rx="12" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
<circle cx="45" cy="107" r="24" fill="#a16207"/>
<text x="45" y="117" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">1</text>
<text x="112" y="114" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Valmistelu ja julkaistu runko</text>
<text x="822" y="114" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 1–3</text>
<text x="112" y="150" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Työkalut → suunnitelma → julkinen osoite</text>
<text x="112" y="180" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Julkaisuputki toimii ennen kuin mitään voi rikkoa.</text>
<path d="M45 136V224" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="230" width="752" height="132" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
<circle cx="45" cy="259" r="24" fill="#c2410c"/>
<text x="45" y="269" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">2</text>
<text x="112" y="266" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Oikea päivänvalodata</text>
<text x="822" y="266" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 4–5</text>
<text x="112" y="302" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Laskenta → paikkakuntahaku → rajapinta</text>
<text x="112" y="332" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kaavio saa luotettavan datan.</text>
<path d="M45 288V376" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="382" width="752" height="132" rx="12" fill="#ffffff" stroke="#9f1239" stroke-width="2"/>
<circle cx="45" cy="411" r="24" fill="#9f1239"/>
<text x="45" y="421" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">3</text>
<text x="112" y="418" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Kaavio matkailijalle</text>
<text x="822" y="418" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 6–10</text>
<text x="112" y="454" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kaavio → monta paikkaa → vihjeruutu → leikkauspisteet</text>
<text x="112" y="484" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Väliversio asiakkaan kokeiltavana työviikolla 10.</text>
<path d="M45 440V528" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="534" width="752" height="132" rx="12" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
<circle cx="45" cy="563" r="24" fill="#1e3a8a"/>
<text x="45" y="573" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">4</text>
<text x="112" y="570" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Viimeistely ja laatu</text>
<text x="822" y="570" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 11–15</text>
<text x="112" y="606" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Palautemuutos → mobiili → tietoturva → testaus</text>
<text x="112" y="636" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Sovellus kestää oikeat käyttäjät ja virheet.</text>
<path d="M45 592V680" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="686" width="752" height="132" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<circle cx="45" cy="715" r="24" fill="#0f766e"/>
<text x="45" y="725" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">5</text>
<text x="112" y="722" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Julkaisu ja näyttö</text>
<text x="822" y="722" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 16–18</text>
<text x="112" y="758" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Julkaisuehdokas → v1.0 → näyttö</text>
<text x="112" y="788" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Asiakas saa osoitteen, jonka voi laittaa sivuilleen.</text>
</svg>
