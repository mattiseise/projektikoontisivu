<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 780" width="620" height="780" role="img" aria-labelledby="lp-title lp-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="lp-title">Havainnekuva: leikkauspiste päiväkohtaisesta datasta</title>
  <desc id="lp-desc">Osa 1: Helsingin ja Rovaniemen päivänvalo 15.–23. maaliskuuta pisteinä. Rovaniemen päivä on aluksi lyhyempi, 19.3. yhtä pitkä ja sen jälkeen pidempi. Erotus Rovaniemi miinus Helsinki on päivittäin −6, −4, −3, −1, 0, +2, +3, +5 ja +6 minuuttia. Kun toleranssi on esimerkiksi 3 minuuttia, viisi peräkkäistä päivää 17.–21.3. ovat osumia, ja niistä tehdään yksi merkki jakson keskelle 19.3. Toleranssi on oma päätöksesi. Osa 2: Utsjoella ja Inarilla on kesällä molemmilla 1440 minuuttia, ja jaksot ovat päällekkäin noin 60 päivää. Erotus on silloin 0 joka päivä. Ilman peräkkäisten päivien yhdistämistä syntyisi noin 60 merkkiä, yhdistettynä yksi. Testitapaus T13 tarkistaa tämän. Luvut ovat pyöristettyjä esimerkkejä.</desc>
  <rect x="0" y="0" width="620" height="780" fill="#ffffff"/>
  <text x="16" y="30" font-size="18" font-weight="700" fill="#241f1a">Havainnekuva: leikkauspiste päiväkohtaisesta datasta</text>

  <!-- Osa 1 -->
  <rect x="12" y="48" width="596" height="396" rx="10" fill="#ffffff" stroke="#e8e1d6" stroke-width="2"/>
