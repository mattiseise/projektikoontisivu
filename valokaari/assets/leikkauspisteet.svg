  <text x="60" y="81" font-size="15" font-weight="700" fill="#241f1a">Käyrät ohittavat toisensa: Helsinki ja Rovaniemi 15.–23.3.</text>

  <text x="74" y="106" font-size="13" fill="#5c5347" text-anchor="end">min</text>
