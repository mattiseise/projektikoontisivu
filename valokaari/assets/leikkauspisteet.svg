  <g font-size="14" fill="#241f1a">
    <text x="28" y="364">Käyrät eivät leikkaa tarkasti, vaan vaihtavat järjestystä päivien välissä.</text>
    <text x="28" y="386">Esimerkki: toleranssi 3 min. Erotus on enintään 3 min viitenä päivänä</text>
    <text x="28" y="408">peräkkäin (17.–21.3.), joten niistä tulee yksi merkki jakson keskelle.</text>
    <text x="28" y="430" font-weight="700" fill="#c2410c">Toleranssi on oma päätöksesi.</text>
  </g>

