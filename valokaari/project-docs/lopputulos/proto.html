<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Valokaari – lopputulos</title>
<meta name="viewport" content="width=1120">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#f3f6fa; --card:#ffffff;
    --ink:#0f1b2d; --muted:#4a5568; --soft:#64748b; --line:#dde4ee; --grid:#e7ecf3;
    --navy:#1d3a63; --navy-dark:#142b4b;
    --accent:#c2410c;
    --hel:#2a78d6; --rov:#eb6834; --uts:#1baf7a;
    --kaamos:#4a3aa7; --kaamos-ink:#3b2d8f; --kaamos-soft:#ece9fb;
    --yoton:#eda100; --yoton-ink:#7a4f00; --yoton-soft:#fdf1d2;
    --err:#b42318; --err-ink:#7a1b12; --err-soft:#fdeceb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1120px;height:700px;overflow:hidden}
  body{
    font-family:"Inter",system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(640px 360px at 88% 108%, rgba(236,120,64,.38), transparent 72%),
      radial-gradient(520px 300px at 55% 112%, rgba(120,90,170,.30), transparent 70%),
      linear-gradient(170deg,#0a1530 0%,#11234a 48%,#1d2c57 76%,#35355f 100%);
    position:relative;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- selainikkuna ---------- */
  .browser{
    position:absolute;left:22px;top:20px;width:850px;height:660px;
    border-radius:12px;overflow:hidden;background:var(--page);
    box-shadow:0 24px 64px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.25);
  }
  .chrome{height:40px;background:#e6ebf2;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #d3dbe6}
  .dots{display:flex;gap:7px}
  .dots i{width:12px;height:12px;border-radius:50%;display:block;background:#c3ccd8}
  .url{flex:0 1 440px;height:26px;border-radius:13px;background:#fff;display:flex;align-items:center;gap:7px;padding:0 13px;font-size:12.5px;color:#4a5568;border:1px solid #d3dbe6}
  .url b{font-weight:600;color:var(--ink)}

  .page{padding:0 48px 0 24px}

  /* ylätunniste + lomake */
  .top{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{width:40px;height:40px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
  .brand small{display:block;font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.02em;line-height:1.2}
  .brand h1{margin:1px 0 0;font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.01em;white-space:nowrap}
  .brand{flex:none}
  .form{display:flex;align-items:flex-end;gap:10px}
  .fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px 2px}
  .input{width:196px;height:38px;border:1.5px solid #b9c5d6;border-radius:9px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 11px;font-size:13.5px;color:#5b6678}
  .btn{height:38px;padding:0 13px;border-radius:9px;background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .select{width:96px;height:38px;border:1.5px solid #b9c5d6;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;font-size:14px;font-weight:700}
  .sep{width:1px;height:38px;background:var(--line);margin:0 4px}

  /* kaaviokortti */
  .card{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px 8px;position:relative;height:512px}
  .cardhead{display:flex;align-items:baseline;justify-content:space-between}
  .cardhead h2{margin:0;font-size:18px;font-weight:700;line-height:1.2}
  .cardhead span{font-size:12.5px;color:var(--soft);font-weight:500}
  .legend{display:flex;align-items:center;gap:7px;margin:10px 0 2px;flex-wrap:nowrap}
  .chip{height:30px;padding:0 5px 0 10px;border-radius:15px;border:1.5px solid #cfd8e4;background:#fff;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .chip i.sw{width:16px;height:4px;border-radius:2px;display:block}
  .chip .x{width:20px;height:20px;border-radius:50%;background:#eef2f7;display:grid;place-items:center}
  .lsep{width:1px;height:24px;background:var(--line);margin:0 5px}
  .key{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;margin-right:5px}
  .key .band{width:18px;height:12px;border-radius:3px;display:block}
  #chart{display:block}

  /* tooltip */
  .tip{position:absolute;width:236px;background:#fff;border:1px solid #cfd8e4;border-radius:10px;
       box-shadow:0 8px 24px rgba(15,27,45,.16);padding:10px 12px 9px;font-size:13px}
  .tip::before{content:"";position:absolute;left:50%;top:-7px;width:12px;height:12px;background:#fff;border-left:1px solid #cfd8e4;border-top:1px solid #cfd8e4;transform:translateX(-50%) rotate(45deg)}
  .tip h3{margin:0 0 6px;font-size:13.5px;font-weight:700}
  .tip .row{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:7px;height:23px}
  .tip .row i{width:10px;height:10px;border-radius:50%;display:block}
  .tip .row b{font-weight:700;text-align:right;white-space:nowrap}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:5px}
  .tag.y{background:var(--yoton-soft);color:var(--yoton-ink)}
  .tag.k{background:var(--kaamos-soft);color:var(--kaamos-ink)}

  /* ---------- puhelin ---------- */
  .phone{position:absolute;left:832px;top:168px;width:240px;height:500px;border-radius:34px;background:#0b1122;padding:9px;
         box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 1.5px #2c3858 inset,0 0 0 1px rgba(255,255,255,.08)}
  .screen{width:222px;height:482px;border-radius:26px;overflow:hidden;background:var(--page);position:relative}
  .island{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:62px;height:17px;border-radius:9px;background:#0b1122}
  .status{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;font-size:12px;font-weight:700}
  .pbody{padding:2px 12px 0}
  .ptitle{font-size:18px;font-weight:800;line-height:1.2;margin:0 0 7px;white-space:nowrap;letter-spacing:-.01em}
  .ptitle .mark{width:24px;height:24px;border-radius:7px;background:var(--navy);display:grid;place-items:center;flex:none}
  .plabel{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px 2px}
  .prow{display:flex;gap:6px}
  .pinput{flex:1;height:36px;border:2px solid var(--err);border-radius:9px;background:#fff;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:500;color:var(--ink)}
  .pbtn{height:36px;padding:0 12px;border-radius:9px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center}
  .perr{margin-top:6px;background:var(--err-soft);border:1px solid #f4c7c3;border-radius:9px;padding:6px 8px;display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.33;color:var(--err-ink);font-weight:500}
  .perr .ic{flex:none;width:17px;height:17px;border-radius:50%;background:var(--err);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
  .pchips{display:flex;gap:5px;margin:7px 0 6px}
  .pchips .chip{height:28px;font-size:12.5px;padding:0 3px 0 7px;gap:5px}
  .pchips .chip .x{width:18px;height:18px}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 6px 2px}
  .pday{margin-top:7px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px 4px}
  .pday .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .pday .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
  .pday .hd span{font-size:12px;font-weight:600;color:var(--muted)}
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%}
  .stepper .sb{width:28px;height:26px;border-radius:7px;border:1.5px solid #cfd8e4;display:grid;place-items:center;background:#fff}
  .stepper b{font-size:14px;font-weight:700;padding:0 3px}
  .pday .row{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:6px;height:22px;font-size:13px}
  .pday .row i{width:9px;height:9px;border-radius:50%;display:block}
  .pday .row b{font-weight:700;white-space:nowrap}
</style>
</head>
<body>

<!-- ======================= SELAINIKKUNA ======================= -->
<div class="browser">
  <div class="chrome">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="url">
      <svg width="11" height="12" viewBox="0 0 11 12"><rect x="1" y="5" width="9" height="6.5" rx="1.5" fill="#6b7686"/><path d="M3 5V3.6a2.5 2.5 0 0 1 5 0V5" fill="none" stroke="#6b7686" stroke-width="1.5"/></svg>
      <span><b>revontulitravel.example.org</b>/paivanvalo</span>
    </div>
  </div>

  <div class="page">
    <div class="top">
      <div class="brand">
        <div class="mark">
          <svg width="26" height="26" viewBox="0 0 26 26"><path d="M5 17a8 8 0 0 1 16 0" fill="#f59e0b"/><path d="M2.5 17.5h21" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M6 21h14" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div>
          <small>Revontuli Travel</small>
          <h1>Päivänvalo Suomessa</h1>
        </div>
      </div>
      <div class="form">
        <div class="fld">
          <label>Paikkakunta</label>
          <div class="input">
            <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#6b7686" stroke-width="1.6"/><path d="M9.5 9.5L13 13" stroke="#6b7686" stroke-width="1.6" stroke-linecap="round"/></svg>
            esim. Inari tai Kuusamo
          </div>
        </div>
        <div class="btn">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          Lisää kaavioon
        </div>
        <div class="sep"></div>
        <div class="fld">
          <label>Vuosi</label>
          <div class="select">2026
            <svg width="12" height="8" viewBox="0 0 12 8"><path d="M1.5 1.5L6 6l4.5-4.5" fill="none" stroke="#1d3a63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="card" id="card">
      <div class="cardhead">
        <h2>Päivän pituus vuonna 2026</h2>
        <span>Vie hiiri kaavion päälle</span>
      </div>
      <div class="legend" id="legend"></div>
      <svg id="chart" width="742" height="422"></svg>
      <div class="tip" id="tip"></div>
    </div>
  </div>
</div>

<!-- ======================= PUHELIN ======================= -->
<div class="phone">
  <div class="screen">
    <div class="island"></div>
    <div class="status"><span>9.41</span>
      <svg width="22" height="11" viewBox="0 0 22 11"><rect x=".75" y=".75" width="18" height="9.5" rx="2.5" fill="none" stroke="#0f1b2d" stroke-width="1.5"/><rect x="3" y="3" width="12" height="5" rx="1" fill="#0f1b2d"/><rect x="20" y="3.5" width="1.6" height="4" rx=".8" fill="#0f1b2d"/></svg>
    </div>
    <div class="pbody">
      <div class="ptitle">
        Päivänvalo Suomessa
      </div>
      <div class="plabel">Paikkakunta</div>
      <div class="prow">
        <div class="pinput">Rovanimi</div>
        <div class="pbtn">Lisää</div>
      </div>
      <div class="perr"><span class="ic">!</span><span>Paikkakuntaa ”Rovanimi” ei löytynyt. Tarkista kirjoitusasu.</span></div>
      <div class="pchips" id="pchips"></div>
      <div class="pcard"><svg id="pchart" width="186" height="126"></svg></div>
      <div class="pday" id="pday"></div>
    </div>
  </div>
</div>

<script>
/* ---------- Päivänvalolaskenta (NOAA:n auringonnousuyhtälö) ---------- */
const YEAR = 2026;
const LEAP = (YEAR % 4 === 0 && YEAR % 100 !== 0) || YEAR % 400 === 0;
const N = LEAP ? 366 : 365;
const RAD = Math.PI / 180;
const PLACES = [
  { name: "Helsinki",  lat: 60.1699, color: "var(--hel)", hex: "#2a78d6" },
  { name: "Rovaniemi", lat: 66.5039, color: "var(--rov)", hex: "#eb6834" },
  { name: "Utsjoki",   lat: 69.9079, color: "var(--uts)", hex: "#1baf7a" }
];
function declination(doy) {            // radiaaneina, NOAA fractional year
  const g = 2 * Math.PI / N * (doy - 1);
  return 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
       - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
       - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
}
function daylightRaw(lat, doy) {       // minuutteina, refraktio + auringon kiekko −0,833°
  const d = declination(doy), p = lat * RAD;
  const c = Math.cos(90.833 * RAD) / (Math.cos(p) * Math.cos(d)) - Math.tan(p) * Math.tan(d);
  if (c >= 1) return 0;                // kaamos
  if (c <= -1) return 1440;            // yötön yö
  return 8 * Math.acos(c) / RAD;
}
PLACES.forEach(pl => {
  pl.raw = []; pl.min = [];
  for (let doy = 1; doy <= N; doy++) { const r = daylightRaw(pl.lat, doy); pl.raw.push(r); pl.min.push(Math.round(r)); }
});
const byName = Object.fromEntries(PLACES.map(p => [p.name, p]));

/* ---------- Muotoilu ---------- */
const KK = ["tammikuuta","helmikuuta","maaliskuuta","huhtikuuta","toukokuuta","kesäkuuta","heinäkuuta","elokuuta","syyskuuta","lokakuuta","marraskuuta","joulukuuta"];
const KK_LYH = ["tammi","helmi","maalis","huhti","touko","kesä","heinä","elo","syys","loka","marras","joulu"];
function dateOf(i) { return new Date(Date.UTC(YEAR, 0, i + 1)); }
function dm(i) { const t = dateOf(i); return t.getUTCDate() + "." + (t.getUTCMonth() + 1) + "."; }
function dmy(i) { return dm(i) + YEAR; }
function longDate(i) { const t = dateOf(i); return t.getUTCDate() + ". " + KK[t.getUTCMonth()] + " " + YEAR; }
function formatMinutes(m) {
  const h = Math.floor(m / 60), r = m % 60;
  if (h === 0) return r + " min";
  if (r === 0) return h + " h";
  return h + " h " + r + " min";
}
function doyIndex(month, day) { return Math.round((Date.UTC(YEAR, month - 1, day) - Date.UTC(YEAR, 0, 1)) / 864e5); }
function runs(arr, value) {
  const out = []; let s = null;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === value && s === null) s = i;
    if (arr[i] !== value && s !== null) { out.push([s, i - 1]); s = null; }
  }
  if (s !== null) out.push([s, arr.length - 1]);
  return out;
}
/* Leikkauspisteet: merkinvaihto kahden sarjan erotuksessa (todellinen risteäminen) */
function crossings(a, b) {
  const out = [];
  for (let i = 0; i < N - 1; i++) {
    const d0 = a.raw[i] - b.raw[i], d1 = a.raw[i + 1] - b.raw[i + 1];
    if (d0 !== 0 && d1 !== 0 && Math.sign(d0) !== Math.sign(d1)) {
      const f = d0 / (d0 - d1);
      out.push({ t: i + f, v: a.raw[i] + (a.raw[i + 1] - a.raw[i]) * f, day: Math.round(i + f), a: a.name, b: b.name });
    }
  }
  return out;
}

/* ---------- SVG-apurit ---------- */
const NS = "http://www.w3.org/2000/svg";
function el(parent, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e); return e;
}
function linePath(arr, X, Y) {
  let d = "";
  for (let i = 0; i < arr.length; i++) d += (i ? "L" : "M") + X(i).toFixed(2) + " " + Y(arr[i]).toFixed(2);
  return d;
}

/* ---------- Kaavio ---------- */
function drawChart(svg, places, o) {
  const W = +svg.getAttribute("width"), H = +svg.getAttribute("height");
  const L = o.m.l, T = o.m.t, PW = W - o.m.l - o.m.r, PH = H - o.m.t - o.m.b;
  const X = i => L + (i / (N - 1)) * PW;
  const Y = m => T + PH * (1 - m / 1440);
  const defs = el(svg, "defs", {});
  const gy = el(defs, "linearGradient", { id: o.id + "gy", x1: 0, y1: 0, x2: 0, y2: 1 });
  el(gy, "stop", { offset: 0, "stop-color": "#eda100", "stop-opacity": .5 });
  el(gy, "stop", { offset: 1, "stop-color": "#eda100", "stop-opacity": 0 });
  const gk = el(defs, "linearGradient", { id: o.id + "gk", x1: 0, y1: 1, x2: 0, y2: 0 });
  el(gk, "stop", { offset: 0, "stop-color": "#4a3aa7", "stop-opacity": .46 });
  el(gk, "stop", { offset: 1, "stop-color": "#4a3aa7", "stop-opacity": 0 });

  // korostusalueet (kaamos ja yötön yö) paikoittain
  const bandH = PH * o.bandHours / 24;
  const bands = { k: [], y: [] };
  places.forEach(p => {
    runs(p.min, 0).forEach(r => bands.k.push({ p, r }));
    runs(p.min, 1440).forEach(r => bands.y.push({ p, r }));
  });
  const bx0 = r => Math.max(L, X(r[0] - .5)), bx1 = r => Math.min(L + PW, X(r[1] + .5));
  bands.y.forEach(({ r }) => el(svg, "rect", { x: bx0(r), y: T, width: bx1(r) - bx0(r), height: bandH, fill: `url(#${o.id}gy)` }));
  bands.k.forEach(({ r }) => el(svg, "rect", { x: bx0(r), y: T + PH - bandH, width: bx1(r) - bx0(r), height: bandH, fill: `url(#${o.id}gk)` }));

  // ruudukko ja y-akseli
  for (let h = 0; h <= 24; h += o.yStep) {
    const y = Y(h * 60);
    el(svg, "line", { x1: L, x2: L + PW, y1: y, y2: y, stroke: (h === 0 || h === 24) ? "#c5cfdc" : "#e7ecf3", "stroke-width": 1 });
    el(svg, "text", { x: L - 7, y: y + 4.3, "text-anchor": "end", "font-size": o.fs, fill: "#4a5568", "font-weight": 500 }, h + " h");
  }
  // kuukaudet
  const monthStarts = [];
  for (let m = 0; m < 12; m++) monthStarts.push(doyIndex(m + 1, 1));
  monthStarts.forEach((s, m) => {
    if (o.monthTicks) el(svg, "line", { x1: X(s), x2: X(s), y1: T + PH, y2: T + PH + 5, stroke: "#b8c3d2" });
  });
  if (o.months === "all") {
    monthStarts.forEach((s, m) => {
      const e = m < 11 ? monthStarts[m + 1] : N;
      el(svg, "text", { x: (X(s) + X(e - 1)) / 2, y: T + PH + 23, "text-anchor": "middle", "font-size": o.fs, fill: "#4a5568", "font-weight": 500 }, KK_LYH[m]);
    });
  } else {
    [[0, X(0), "start"], [6, X(monthStarts[6]), "middle"], [11, X(N - 1), "end"]].forEach(([m, x, a]) => {
      el(svg, "line", { x1: x, x2: x, y1: T + PH, y2: T + PH + 4, stroke: "#b8c3d2" });
      el(svg, "text", { x, y: T + PH + 19, "text-anchor": a, "font-size": o.fs, fill: "#4a5568", "font-weight": 500 }, KK_LYH[m]);
    });
  }

  // voimakas palkki ääriarvon kohdalla (0 h / 24 h)
  const yb = T - o.barW / 2 - 1, kb = T + PH + o.barW / 2 + 1;
  bands.y.forEach(({ r }) => el(svg, "line", { x1: bx0(r), x2: bx1(r), y1: yb, y2: yb, stroke: "#eda100", "stroke-width": o.barW, "stroke-linecap": "butt" }));
  bands.k.forEach(({ r }) => el(svg, "line", { x1: bx0(r), x2: bx1(r), y1: kb, y2: kb, stroke: "#4a3aa7", "stroke-width": o.barW, "stroke-linecap": "butt" }));

  // viivat (valkoinen reunus erottaa päällekkäiset)
  o.order.forEach(n => {
    const p = byName[n]; if (!places.includes(p)) return;
    const d = linePath(p.min, X, Y);
    el(svg, "path", { d, fill: "none", stroke: "#fff", "stroke-width": o.lw + 3, "stroke-linejoin": "round", "stroke-linecap": "round" });
    el(svg, "path", { d, fill: "none", stroke: p.hex, "stroke-width": o.lw, "stroke-linejoin": "round", "stroke-linecap": "round" });
  });

  return { X, Y, L, T, PW, PH, bands };
}

/* ---------- Työpöytänäkymä ---------- */
const svg = document.getElementById("chart");
const g = drawChart(svg, PLACES, {
  id: "d", m: { l: 46, r: 12, t: 34, b: 52 }, fs: 12.5, yStep: 6, bandHours: 6, barW: 7, lw: 2.4,
  months: "all", monthTicks: true, order: ["Helsinki", "Utsjoki", "Rovaniemi"]
});
const { X, Y, L, T, PW, PH } = g;

// yötön yö -otsikko kaavion yläpuolelle
(function () {
  const ys = g.bands.y.map(b => b.r[0]), ye = g.bands.y.map(b => b.r[1]);
  const cx = (X(Math.min(...ys)) + X(Math.max(...ye))) / 2;
  const t = el(svg, "text", { x: cx, y: T - 16, "text-anchor": "middle", "font-size": 12.5, fill: "#7a4f00" });
  el(t, "tspan", { "font-weight": 800, "font-size": 13.5 }, "yötön yö ");
  const parts = g.bands.y.slice().sort((a, b) => a.r[0] - b.r[0]).map(b => b.p.name + " " + dm(b.r[0]) + "–" + dm(b.r[1]));
  el(t, "tspan", { "font-weight": 500 }, " · " + parts.join(" · "));
  // pieni aurinko
  const bb = t.getBBox();
  const sx = bb.x - 13, sy = T - 20.5;
  el(svg, "circle", { cx: sx, cy: sy, r: 4.2, fill: "#eda100" });
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; el(svg, "line", { x1: sx + Math.cos(a) * 6.3, y1: sy + Math.sin(a) * 6.3, x2: sx + Math.cos(a) * 8.3, y2: sy + Math.sin(a) * 8.3, stroke: "#eda100", "stroke-width": 1.5, "stroke-linecap": "round" }); }
})();

// kaamos-otsikot kuukausirivin alle
(function () {
  const ks = g.bands.k.slice().sort((a, b) => a.r[0] - b.r[0]);
  ks.forEach((b, idx) => {
    const left = b.r[0] === 0;
    const x = left ? L : L + PW;
    const t = el(svg, "text", { x, y: T + PH + 45, "text-anchor": left ? "start" : "end", "font-size": 12.5, fill: "#3b2d8f" });
    el(t, "tspan", { "font-weight": 800, "font-size": 13.5 }, "kaamos ");
    el(t, "tspan", { "font-weight": 500 }, " · " + b.p.name + " " + dm(b.r[0]) + "–" + dm(b.r[1]));
    // kuunsirppi
    const bb = t.getBBox();
    const mx = left ? bb.x + bb.width + 12 : bb.x - 12, my = T + PH + 40.5;
    el(svg, "path", { d: `M${mx + 2} ${my - 5.5}a5.5 5.5 0 1 0 3.5 9.6a4.4 4.4 0 1 1 -3.5 -9.6z`, fill: "#4a3aa7" });
  });
})();

// leikkauspisteet: kaikki parit
const cross = [];
for (let i = 0; i < PLACES.length; i++) for (let j = i + 1; j < PLACES.length; j++) cross.push(...crossings(PLACES[i], PLACES[j]));
// ryhmitellään saman päivän leikkaukset yhdeksi merkiksi
const groups = [];
cross.sort((a, b) => a.t - b.t).forEach(c => {
  const gr = groups.find(q => Math.abs(q.t - c.t) < 1.5);
  if (gr) { gr.items.push(c); } else groups.push({ t: c.t, v: c.v, day: c.day, items: [c] });
});
groups.forEach(gr => {
  const t = gr.items.reduce((s, c) => s + c.t, 0) / gr.items.length;
  const v = gr.items.reduce((s, c) => s + c.v, 0) / gr.items.length;
  gr.t = t; gr.v = v; gr.day = Math.round(t);
  const cx = X(t), cy = Y(v);
  el(svg, "circle", { cx, cy, r: 8, fill: "#fff", stroke: "#0f1b2d", "stroke-width": 2.2 });
  el(svg, "circle", { cx, cy, r: 3, fill: "#0f1b2d" });
  const spring = gr.day < 180;
  const tx = spring ? cx - 12 : cx + 12, ty = cy - 14;
  el(svg, "text", { x: tx, y: ty, "text-anchor": spring ? "end" : "start", "font-size": 13, "font-weight": 700, fill: "#0f1b2d", stroke: "#fff", "stroke-width": 4, "paint-order": "stroke" }, dm(gr.day));
});
window.__groups = groups;

// hiiren kohta: 21.6.
const HI = doyIndex(6, 21);
const hx = X(HI);
el(svg, "line", { x1: hx, x2: hx, y1: T, y2: T + PH, stroke: "#0f1b2d", "stroke-width": 1.2, "stroke-dasharray": "4 4", "stroke-opacity": .55 });
[["Utsjoki", 7], ["Rovaniemi", 4.2], ["Helsinki", 5.5]].forEach(([n, r]) => {
  const p = byName[n];
  el(svg, "circle", { cx: hx, cy: Y(p.min[HI]), r, fill: p.hex, stroke: "#fff", "stroke-width": 2 });
});
// hiiren osoitin
(function () {
  const px = hx + 5, py = Y(21 * 60) - 4;
  el(svg, "path", { d: `M${px} ${py}l0 17l4.3 -4.1l3 6.6l2.9 -1.3l-3 -6.4l6 -.3z`, fill: "#0f1b2d", stroke: "#fff", "stroke-width": 1.4, "stroke-linejoin": "round" });
})();

// tooltip
(function () {
  const tip = document.getElementById("tip");
  const rows = PLACES.slice().sort((a, b) => b.min[HI] - a.min[HI]).map(p => {
    const m = p.min[HI];
    const tag = m === 1440 ? '<span class="tag y">yötön yö</span>' : m === 0 ? '<span class="tag k">kaamos</span>' : "";
    return `<div class="row"><i style="background:${p.hex}"></i><span>${p.name}</span><b>${formatMinutes(m)}${tag}</b></div>`;
  }).join("");
  tip.innerHTML = `<h3>${longDate(HI)}</h3>${rows}`;
  const cr = document.getElementById("card").getBoundingClientRect(), sr = svg.getBoundingClientRect();
  const svgTop = sr.top - cr.top - 1, svgLeft = sr.left - cr.left - 1;
  const w = 236;
  tip.style.left = (svgLeft + hx - w / 2) + "px";
  tip.style.top = (svgTop + Y(10.6 * 60)) + "px";
})();

// legenda: paikat (poistettavat) + merkit
(function () {
  const lg = document.getElementById("legend");
  const xicon = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="#334155" stroke-width="1.7" stroke-linecap="round"/></svg>';
  lg.innerHTML = PLACES.map(p => `<div class="chip"><i class="sw" style="background:${p.hex}"></i>${p.name}<span class="x" title="Poista">${xicon}</span></div>`).join("")
    + '<div class="lsep"></div>'
    + '<div class="key"><span class="band" style="background:linear-gradient(#4a3aa700,#4a3aa766);border-bottom:4px solid #4a3aa7"></span>kaamos</div>'
    + '<div class="key"><span class="band" style="background:linear-gradient(#eda1007a,#eda10000);border-top:4px solid #eda100"></span>yötön yö</div>'
    + '<div class="key"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="#fff" stroke="#0f1b2d" stroke-width="2"/><circle cx="8" cy="8" r="2.3" fill="#0f1b2d"/></svg>yhtä pitkä päivä</div>';
})();

/* ---------- Puhelinnäkymä ---------- */
(function () {
  const pp = [byName.Helsinki, byName.Utsjoki];
  const xicon = '<svg width="9" height="9" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/></svg>';
  document.getElementById("pchips").innerHTML = pp.map(p => `<div class="chip"><i class="sw" style="background:${p.hex};width:11px"></i>${p.name}<span class="x">${xicon}</span></div>`).join("");
  const ps = document.getElementById("pchart");
  const pg = drawChart(ps, pp, {
    id: "p", m: { l: 32, r: 5, t: 8, b: 22 }, fs: 12, yStep: 12, bandHours: 7, barW: 5, lw: 2,
    months: "quarters", monthTicks: false, order: ["Helsinki", "Utsjoki"]
  });
  const SI = doyIndex(1, 15);
  const sx = pg.X(SI);
  el(ps, "line", { x1: sx, x2: sx, y1: pg.T, y2: pg.T + pg.PH, stroke: "#0f1b2d", "stroke-width": 1.2, "stroke-dasharray": "3 3", "stroke-opacity": .6 });
  pp.forEach(p => el(ps, "circle", { cx: sx, cy: pg.Y(p.min[SI]), r: 4, fill: p.hex, stroke: "#fff", "stroke-width": 1.6 }));

  const chev = d => `<span class="sb"><svg width="8" height="10" viewBox="0 0 8 10"><path d="${d}" fill="none" stroke="#1d3a63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  const rows = pp.map(p => {
    const m = p.min[SI];
    const tag = m === 0 ? '<span class="tag k">kaamos</span>' : m === 1440 ? '<span class="tag y">yötön yö</span>' : "";
    return `<div class="row"><i style="background:${p.hex}"></i><span>${p.name}</span><b>${formatMinutes(m)}${tag}</b></div>`;
  }).join("");
  document.getElementById("pday").innerHTML =
    `<div class="lbl">Valittu päivä</div><div class="hd"><div class="stepper">${chev("M5.5 1.5L2 5l3.5 3.5")}<b>${dmy(SI)}</b>${chev("M2.5 1.5L6 5 2.5 8.5")}</div></div>${rows}`;
})();

/* ---------- tarkistusloki ---------- */
window.__check = {
  hel: [formatMinutes(byName.Helsinki.min[HI]), formatMinutes(byName.Helsinki.min[doyIndex(12, 21)])],
  groups: groups.map(q => ({ day: dm(q.day), t: q.t.toFixed(2), v: q.v.toFixed(1), pairs: q.items.map(c => c.a + "–" + c.b) }))
};
</script>
</body>
</html>
