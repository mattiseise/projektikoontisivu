<?xml version="1.0" encoding="UTF-8"?>
<!-- Vektoripajan esimerkkipiirros. Itsetesti käyttää tätä tiedostoa.
     Kaksi layeria, kummassakin yksi puoliprofiili. Pyörähdysakseli on x = 0. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="200" height="300" viewBox="0 0 200 300">
  <g inkscape:groupmode="layer" inkscape:label="maljakko" id="layer-maljakko">
    <path id="maljakko" d="M 0,280 L 60,280 L 70,240 L 45,160 L 40,120 L 55,60 L 50,40 L 0,40"
          fill="none" stroke="#1fa4e3" stroke-width="2"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="kansi" id="layer-kansi">
    <path id="kansi" d="M 0,40 L 55,40 L 55,25 L 10,15 L 0,15"
          fill="none" stroke="#1fa4e3" stroke-width="2"/>
  </g>
</svg>
