<svg xmlns="http://www.w3.org/2000/svg" width="880" height="940" viewBox="0 0 880 940" role="img" aria-labelledby="title desc">
<title id="title">Vektoripajan viisi vaihetta</title><desc id="desc">Valmistelu viikoilla 40–41, 3D-mallin rakentaminen 43–47, ensimmäinen toimiva versio 48–51, parannukset 2–5 ja julkaisu sekä näyttö 6–9. Syysloma 42, joululoma 52–1 ja talviloma 8 ovat taukoja.</desc>
<rect width="880" height="940" fill="#000"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1fa4e3" stroke-width="1.4"/></marker></defs>
<text x="40" y="49" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Mitä syntyy missäkin vaiheessa?</text><rect x="90" y="78" width="752" height="152" rx="12" fill="#000" stroke="#1fa4e3" stroke-width="2"/><circle cx="45" cy="107" r="24" fill="#1fa4e3"/><text x="45" y="117" fill="#000" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">1</text><path d="M45 138V235" stroke="#1fa4e3" stroke-width="2" marker-end="url(#arrow)"/><text x="112" y="112" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Valmistelu</text><text x="820" y="112" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="end">Viikot 40–41</text><text x="112" y="148" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Työkalut ja kuutioharjoitus</text><text x="112" y="183" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Opit tekemään, testaamaan ja julkaisemaan.</text><text x="112" y="213" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Syysloma · viikko 42</text><rect x="90" y="249" width="752" height="152" rx="12" fill="#000" stroke="#1fa4e3" stroke-width="2"/><circle cx="45" cy="278" r="24" fill="#1fa4e3"/><text x="45" y="288" fill="#000" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">2</text><path d="M45 309V406" stroke="#1fa4e3" stroke-width="2" marker-end="url(#arrow)"/><text x="112" y="283" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Piirroksesta 3D-malliksi</text><text x="820" y="283" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="end">Viikot 43–47</text><text x="112" y="319" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Tuonti → osat → muodot → muokkaus</text><text x="112" y="354" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Sovelluksen perustoiminnot syntyvät.</text><rect x="90" y="420" width="752" height="152" rx="12" fill="#000" stroke="#1fa4e3" stroke-width="2"/><circle cx="45" cy="449" r="24" fill="#1fa4e3"/><text x="45" y="459" fill="#000" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">3</text><path d="M45 480V577" stroke="#1fa4e3" stroke-width="2" marker-end="url(#arrow)"/><text x="112" y="454" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Ensimmäinen toimiva versio</text><text x="820" y="454" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="end">Viikot 48–51</text><text x="112" y="490" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Kiertopiste → vienti → tallennus → kokeilu</text><text x="112" y="525" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Asiakkaat kokeilevat koko työnkulkua.</text><text x="112" y="555" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Joululoma · viikot 52–1</text><rect x="90" y="591" width="752" height="152" rx="12" fill="#000" stroke="#1fa4e3" stroke-width="2"/><circle cx="45" cy="620" r="24" fill="#1fa4e3"/><text x="45" y="630" fill="#000" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">4</text><path d="M45 651V748" stroke="#1fa4e3" stroke-width="2" marker-end="url(#arrow)"/><text x="112" y="625" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Parannukset</text><text x="820" y="625" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="end">Viikot 2–5</text><text x="112" y="661" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Korjaukset ja sovitut jatkotoiminnot</text><text x="112" y="696" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Palaute ohjaa seuraavia muutoksia.</text><rect x="90" y="762" width="752" height="152" rx="12" fill="#000" stroke="#1fa4e3" stroke-width="2"/><circle cx="45" cy="791" r="24" fill="#1fa4e3"/><text x="45" y="801" fill="#000" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">5</text><text x="112" y="796" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Julkaisu ja näyttö</text><text x="820" y="796" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="end">Viikot 6–9</text><text x="112" y="832" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Julkaisutesti → v1.0 → esittely</text><text x="112" y="867" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Toinen käyttäjä saa sovelluksen käyttöön.</text><text x="112" y="897" fill="#1fa4e3" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Talviloma viikolla 8 · näyttö viikolla 9</text>
</svg>