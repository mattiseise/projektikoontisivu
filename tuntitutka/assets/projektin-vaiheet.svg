<svg xmlns="http://www.w3.org/2000/svg" width="880" height="844" viewBox="0 0 880 844" role="img" aria-labelledby="title desc">
<title id="title">TuntiTutka: projektin vaiheet</title>
<desc id="desc">1. Valmistelu ja julkaistu runko (työviikot 1–3): Otat työkalut käyttöön, teet hyväksytyn suunnitelman ja tietomallin ja viet tyhjän rungon julkiseen osoitteeseen. Tietomalli tehdään ensin, koska kaikki yhteenvedot lasketaan sen tauluista, ja julkaisu on helpointa korjata, kun rikottavaa on vähän. 2. Tuntien kirjaaminen (työviikot 4–7): Rakennat kirjautumisen ja roolit, tuntikirjauksen, projektien hallinnan ja omien kirjausten käsittelyn. Vaiheen lopussa työntekijät kirjaavat tunnit oikeisiin projekteihin ja sinä kirjaat omasi, joten raportteihin kertyy aitoa dataa. 3. Yhteenvedot ja asiakaskatselmointi (työviikot 8–10): Lasket kirjauksista yhteenvedot kolmella ryhmittelyllä ja teet niistä kaaviot. Asiakkaan roolissa oleva testaaja kokeilee väliversiota, ja hänen palautteensa ohjaa loppua. 4. Viimeistely ja laatu (työviikot 11–15): Toteutat katselmoinnin tärkeimmän muutoksen, teet sovelluksesta puhelimella ja näppäimistöllä toimivan ja arvioit tietoturvan. Testaus ja dokumentaatio kootaan valmiiksi ennen julkaisua. 5. Julkaisu ja näyttö (työviikot 16–18): Ulkopuolinen testaaja kokeilee julkaisuehdokasta pelkän kirjallisen ohjeen avulla. Korjaat estävät virheet, julkaiset v1.0:n ja kokoat näyttöaineiston.</desc>
<rect width="880" height="844" fill="#ffffff"/>
<defs><marker id="nuoli" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c5347" stroke-width="1.4"/></marker></defs>
<text x="40" y="49" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Mitä syntyy missäkin vaiheessa?</text>
<rect x="90" y="78" width="752" height="132" rx="12" fill="#ffffff" stroke="#1a6fae" stroke-width="2"/>
<circle cx="45" cy="107" r="24" fill="#1a6fae"/>
<text x="45" y="117" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">1</text>
<text x="112" y="114" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Valmistelu ja julkaistu runko</text>
<text x="822" y="114" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 1–3</text>
<text x="112" y="150" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Työkalut → suunnitelma ja tietomalli → julkinen osoite</text>
<text x="112" y="180" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Julkaisuputki toimii, ennen kuin mitään voi rikkoa.</text>
<path d="M45 136V224" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="230" width="752" height="132" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<circle cx="45" cy="259" r="24" fill="#0e7490"/>
<text x="45" y="269" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">2</text>
<text x="112" y="266" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Tuntien kirjaaminen</text>
<text x="822" y="266" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 4–7</text>
<text x="112" y="302" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Roolit → tuntikirjaus → hallinta → omat kirjaukset</text>
<text x="112" y="332" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kirjauksia kertyy, ja niistä voi laskea yhteenvedot.</text>
<path d="M45 288V376" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="382" width="752" height="132" rx="12" fill="#ffffff" stroke="#b83280" stroke-width="2"/>
<circle cx="45" cy="411" r="24" fill="#b83280"/>
<text x="45" y="421" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">3</text>
<text x="112" y="418" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Yhteenvedot ja asiakaskatselmointi</text>
<text x="822" y="418" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 8–10</text>
<text x="112" y="454" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Laskenta → kaaviot → asiakaskatselmointi</text>
<text x="112" y="484" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Projektipäällikkö näkee ajantasaiset yhteenvedot.</text>
<path d="M45 440V528" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="534" width="752" height="132" rx="12" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
<circle cx="45" cy="563" r="24" fill="#a16207"/>
<text x="45" y="573" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">4</text>
<text x="112" y="570" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Viimeistely ja laatu</text>
<text x="822" y="570" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 11–15</text>
<text x="112" y="606" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Palautemuutos → mobiili → tietoturva → testaus → ohjeet</text>
<text x="112" y="636" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Sovellus kestää oikeat käyttäjät ja virheet.</text>
<path d="M45 592V680" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="686" width="752" height="132" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<circle cx="45" cy="715" r="24" fill="#6d28d9"/>
<text x="45" y="725" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">5</text>
<text x="112" y="722" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Julkaisu ja näyttö</text>
<text x="822" y="722" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Työviikot 16–18</text>
<text x="112" y="758" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Julkaisuehdokas → v1.0 → näyttö</text>
<text x="112" y="788" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Tiimi saa osoitteen ja ohjeen, jolla pääsee alkuun.</text>
</svg>
