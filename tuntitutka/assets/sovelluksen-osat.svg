<text x="684" y="222" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">tehtavalaji</text>
<rect x="674" y="228" width="248" height="24" rx="5" fill="#e3f2f6"/>
<text x="684" y="245" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">kirjaus</text>
<text x="684" y="272" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">projektin_jasen</text>
<rect x="676" y="286" width="244" height="82" rx="8" fill="#fbeef6" stroke="#b83280" stroke-width="2"/>
<text x="692" y="310" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Ei summataulua</text>
<text x="692" y="332" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">summat lasketaan</text>
