<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-labelledby="title desc">
<title id="title">Miten TuntiTutkan osat liittyvät toisiinsa</title>
<desc id="desc">Havainnekuva, ei kuvakaappaus. Selaimessa toimiva Svelte-sovellus (client/) sisältää kirjausnäkymän, hallintanäkymät, jotka näkyvät vain projektipäällikölle, ja raporttinäkymän sekä reititys- ja kaaviokirjaston. Node.js- ja Express-palvelimessa (server/) middleware tarkistaa kirjautumisen ja roolin ennen reittiä ja palauttaa tarvittaessa 401 tai 403, reitit validoivat syötteen ja tarkistavat omistajuuden, ja laskentamoduuli laskee summat kyselyllä joka kerta. Rajapinta palauttaa JSONia. SQLite-tietokannassa ovat taulut kayttaja, projekti, projektityyppi, tehtavalaji, kirjaus ja projektin_jasen. Summataulua ei ole: summat lasketaan kirjaus-riveistä. Tietovirta 1: työntekijä tallentaa kirjauksen, selain lähettää sen reitille POST /api/kirjaukset, middleware tarkistaa kirjautumisen ja roolin, reitti validoi kirjauksen ja tallentaa uuden rivin kirjaus-tauluun. Tietovirta 2: projektipäällikkö avaa raportin, selain kutsuu reittiä GET /api/raportit, laskentamoduuli laskee summat kirjaus-riveistä joka pyynnöllä ja palauttaa JSONin, josta selain piirtää taulukon ja kaaviot. Julkaisussa Express tarjoilee Svelte-buildin ja /api-reitit samasta julkisesta osoitteesta työviikosta 3 alkaen. Kehityksessä Viten proxy ohjaa selaimen /api-kutsut Express-palvelimelle.</desc>
